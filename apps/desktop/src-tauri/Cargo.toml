[package]
name = "soloops-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "soloops as a macOS app"
publish = false

[lib]
name = "soloops_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: the overlay widget is a transparent window, which on
# macOS Tauri only allows behind that flag. Nothing is shipped through an App
# Store here, and without it the widget would be a grey rectangle with square
# corners sitting on top of everything.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
# Both already come in through tauri — declared so this crate may use them.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# An app for exactly one machine — small and stripped is enough.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Proc macros and build scripts are dylibs that rustc loads while compiling,
# and the `strip` above reaches them too: macOS then refuses to dlopen them
# ("mis-aligned LINKEDIT string pool") and every derive in the dependency
# tree turns into "can't find crate". The binary stays stripped, the compiler
# plugins stay loadable.
[profile.release.build-override]
strip = false
