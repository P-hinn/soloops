[package]
name = "soloops-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "soloops als macOS-App"
publish = false

[lib]
name = "soloops_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }

[profile.release]
# Eine App fuer genau einen Rechner — klein und ohne Symbole reicht.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
