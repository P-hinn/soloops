<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>soloops</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        background: #f1efe8;
        color: #171714;
        font:
          15px/1.5 -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      svg {
        width: 72px;
        height: 72px;
      }
      #status {
        min-height: 1.5em;
        letter-spacing: 0.01em;
      }
      #status.bad {
        color: #a3341f;
        max-width: 34rem;
        text-align: center;
        white-space: pre-line;
      }
      .bar {
        width: 180px;
        height: 2px;
        background: rgba(23, 23, 20, 0.12);
        overflow: hidden;
      }
      .bar i {
        display: block;
        width: 40%;
        height: 100%;
        background: #171714;
        animation: slide 1.1s ease-in-out infinite;
      }
      .bar.done {
        visibility: hidden;
      }
      @keyframes slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .bar i {
          animation: none;
          width: 100%;
          opacity: 0.4;
        }
      }
    </style>
  </head>

    <p id="status">startet …</p>
    <div class="bar" id="bar"><i></i></div>
    <script>
      // Wird aus Rust heraus aufgerufen, waehrend die Container hochfahren.
      window.soloopsStatus = (text, bad) => {
        const el = document.getElementById('status')
        el.textContent = text
        el.classList.toggle('bad', !!bad)
        document.getElementById('bar').classList.toggle('done', !!bad)
      }
