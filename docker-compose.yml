name: soloops

x-node: &node
  build:
    context: .
    dockerfile: Dockerfile
    # The Dockerfile is multi-stage — without a target you end up in `runtime`.
    target: base
  env_file: .env
  volumes:
    - .:/app
    - node_modules_root:/app/node_modules
    - ./data:/data
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *node
    restart: unless-stopped
    # Generate before pushing: node_modules lives in a named volume, so a client
    # generated for an older schema survives restarts and crashes the API.
    command: sh -c "npx prisma generate --schema apps/api/prisma/schema.prisma && npx prisma db push --schema apps/api/prisma/schema.prisma --skip-generate && npm -w @soloops/api run dev"
    ports:
      # 3000 is often taken by some other dev server already
      - '${API_PORT:-3000}:3000'

  worker:
    <<: *node
    restart: unless-stopped
    command: npm -w @soloops/worker run dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  web:
    <<: *node
    restart: unless-stopped
    command: npm -w @soloops/web run dev
    ports:
      # on many machines 5173 is taken by another Vite already
      - '${WEB_PORT:-5174}:5173'
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
  redisdata:
  node_modules_root:
