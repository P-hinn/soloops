name: soloops

x-node: &node
  build:
    context: .
    dockerfile: Dockerfile
  env_file: .env
  volumes:
    - .:/app
    - node_modules_root:/app/node_modules
    - ./data:/data
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *node
    restart: unless-stopped
    command: sh -c "npx prisma db push --schema apps/api/prisma/schema.prisma --skip-generate && npm -w @soloops/api run dev"
    ports:
      - '3000:3000'

  worker:
    <<: *node
    restart: unless-stopped
    command: npm -w @soloops/worker run dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  web:
    <<: *node
    restart: unless-stopped
    command: npm -w @soloops/web run dev
    ports:
      # 5173 ist auf vielen Rechnern schon von einem anderen Vite belegt
      - '${WEB_PORT:-5174}:5173'
    depends_on:
      api:
        condition: service_started

  transcribe:
    build:
      context: ./services/transcribe
    restart: unless-stopped
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-medium}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-de}
    volumes:
      - ./data:/data
      - whispermodels:/models
    ports:
      - '8080:8080'

volumes:
  pgdata:
  redisdata:
  whispermodels:
  node_modules_root:
