name: soloops

x-node: &node
  build:
    context: .
    dockerfile: Dockerfile
    # The Dockerfile is multi-stage — without a target you end up in `runtime`.
    target: base
  env_file: .env
  volumes:
    - .:/app
    - node_modules_root:/app/node_modules
    - ./data:/data
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *node
    restart: unless-stopped
    # Generate before pushing: node_modules lives in a named volume, so a client
    # generated for an older schema survives restarts and crashes the API.
    command: sh -c "npx prisma generate --schema apps/api/prisma/schema.prisma && npx prisma db push --schema apps/api/prisma/schema.prisma --skip-generate && npm -w @soloops/api run dev"
    ports:
      # 3000 is often taken by some other dev server already
      - '${API_PORT:-3000}:3000'

  worker:
    <<: *node
    restart: unless-stopped
    command: npm -w @soloops/worker run dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  # n8n is the drag-and-drop surface behind "Automatisierungen". It is served
  # under /n8n/ through the web origin, not on its own host — that is what
  # lets the editor sit in an iframe inside soloops, and it keeps webhook
  # URLs on the one address the browser already trusts.
  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_IMAGE_TAG:-latest}
    restart: unless-stopped
    # Deliberately no `env_file: .env` — n8n has no business holding the
    # database URL, the JWT secret or the Anthropic key. Everything it needs
    # is spelled out here.
    environment:
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_LISTEN_ADDRESS: 0.0.0.0
      # Served under a sub-path, so every asset and REST call it emits is
      # prefixed and survives the proxy in front of it.
      N8N_PATH: /n8n/
      N8N_EDITOR_BASE_URL: ${APP_URL:-http://localhost:5174}/n8n/
      WEBHOOK_URL: ${APP_URL:-http://localhost:5174}/n8n/
      # Development runs over plain http, where a Secure cookie never arrives.
      N8N_SECURE_COOKIE: 'false'
      # Without this n8n logs a deprecation warning on every boot.
      N8N_RUNNERS_ENABLED: 'true'
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
      GENERIC_TIMEZONE: ${TZ:-Europe/Berlin}
      TZ: ${TZ:-Europe/Berlin}
      # The soloops nodes. Mounted read-only from the monorepo, so a rebuild
      # of the package plus a restart of this one container is the whole
      # deploy of a connector change.
      N8N_CUSTOM_EXTENSIONS: /custom-nodes/n8n-nodes-soloops
    volumes:
      # A named volume, not a bind mount under ./data: Docker would create
      # that one owned by root and n8n runs as uid 1000, which leaves it
      # unable to write its own database.
      - n8ndata:/home/node/.n8n
      - ./packages/n8n-nodes-soloops:/custom-nodes/n8n-nodes-soloops:ro
    ports:
      # Also reachable directly — handy when the editor misbehaves behind the
      # proxy and you want to rule the proxy out.
      - '${N8N_PORT:-5678}:5678'

  web:
    <<: *node
    restart: unless-stopped
    command: npm -w @soloops/web run dev
    ports:
      # on many machines 5173 is taken by another Vite already
      - '${WEB_PORT:-5174}:5173'
    depends_on:
      api:
        condition: service_started
      n8n:
        condition: service_started

volumes:
  pgdata:
  redisdata:
  n8ndata:
  node_modules_root:
