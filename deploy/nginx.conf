# Ein Eingang für alles: statisches Vue-Bundle + /api an die Fastify-API.
# Damit braucht soloops nach außen genau einen Port.

upstream soloops_api {
  server api:3000;
  keepalive 8;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Der Reverse Proxy davor terminiert TLS; hier nur die Basisabsicherung.
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  client_max_body_size 8m;

  location /api/ {
    proxy_pass http://soloops_api;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # PDF-Rendering und AI-Aufrufe dürfen dauern
    proxy_read_timeout 120s;
  }

  location = /health {
    proxy_pass http://soloops_api/health;
    access_log off;
  }

  # Gehashte Assets sind unveränderlich, index.html nie cachen
  location /assets/ {
    expires 1y;
    add_header Cache-Control 'public, immutable';
  }

  location = /index.html {
    add_header Cache-Control 'no-store';
  }

  # SPA: alles andere an den Vue-Router
  location / {
    try_files $uri $uri/ /index.html;
  }
}
