# One entrance for everything: the static Vue bundle + /api to the Fastify
# API. That way soloops needs exactly one port facing outwards.

upstream soloops_api {
  server api:3000;
  keepalive 8;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The reverse proxy in front terminates TLS; this is only the basics.
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  client_max_body_size 8m;

  location /api/ {
    proxy_pass http://soloops_api;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # PDF rendering and AI calls are allowed to take their time
    proxy_read_timeout 120s;
  }

  location = /health {
    proxy_pass http://soloops_api/health;
    access_log off;
  }

  # Hashed assets are immutable; never cache index.html
  location /assets/ {
    expires 1y;
    add_header Cache-Control 'public, immutable';
  }

  location = /index.html {
    add_header Cache-Control 'no-store';
  }

  # SPA: everything else goes to the Vue router
  location / {
    try_files $uri $uri/ /index.html;
  }
}
