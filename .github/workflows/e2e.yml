name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        working-directory: .
      # npm/cli#4828: the lock file only carries the platform binaries of the
      # machine it was written on, and this one is written on an arm64 Mac.
      # vite 8 builds with rolldown, whose binding is a platform binary, so on
      # a Linux runner the dev server cannot start — which is why every run of
      # this workflow failed from the vite 8 upgrade onwards.
      - name: Linux-Binaries nachziehen
        working-directory: .
        run: |
          version=$(node -p "require('rolldown/package.json').version")
          npm install --no-save --no-audit --no-fund "@rolldown/binding-linux-x64-gnu@$version"
      - name: Install browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run tests
        run: npx playwright test --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: report-${{ matrix.browser }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14
