name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Installed without the lock file, which is what npm's own error
      # message asks for and the only thing that actually works here.
      #
      # The lock file carries only the platform binaries of the machine that
      # wrote it (npm/cli#4828), and this one is written on an arm64 Mac. The
      # dev server needs three of them on Linux — rolldown for vite 8,
      # @tailwindcss/oxide, and lightningcss in two versions, because vite
      # brings its own. `npm ci` installs exactly what the lock file says;
      # `npm install` keeps resolving against it. Both leave the hole, and
      # vite then dies with "Cannot find native binding" before Playwright
      # ever gets a server — which is why every run of this workflow failed
      # from the vite 8 upgrade onwards.
      #
      # So: resolve fresh for this platform. These are browser smoke tests
      # against a mocked API; they do not depend on the exactness of `ci`,
      # and the check workflow next door keeps it.
      - name: Abhängigkeiten für diese Plattform
        working-directory: .
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund
      - name: Install browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run tests
        run: npx playwright test --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: report-${{ matrix.browser }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14
