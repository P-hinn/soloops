name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # `npm install` and not `npm ci`, on purpose.
      #
      # The lock file only carries the platform binaries of the machine that
      # wrote it (npm/cli#4828), and this one is written on an arm64 Mac. The
      # dev server needs three of them on Linux — rolldown for vite 8,
      # @tailwindcss/oxide, and lightningcss in two different versions — and
      # `npm ci` installs exactly what the lock file says, so it cannot fill
      # holes the lock file does not know about. That is why every run of this
      # workflow failed from the vite 8 upgrade onwards: "Cannot find native
      # binding", and Playwright never got a server.
      #
      # `npm install` resolves optional dependencies for the platform it runs
      # on. It costs the exactness of `ci`, which these browser tests do not
      # depend on; the check workflow next door keeps `npm ci`.
      - run: npm install --no-audit --no-fund
        working-directory: .
      - name: Install browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run tests
        run: npx playwright test --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: report-${{ matrix.browser }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14
